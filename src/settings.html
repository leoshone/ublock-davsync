            <option value="#56a22b">
            <option value="#2ea283">
            <option value="#309fa6">
            <option value="#3498d6">
            <option value="#ad75f4">
            <option value="#f542d6">
            <option value="#919191"><!-- h:0 S:0 Luv:60 -->
        </datalist>

    <div class="li"><label><span class="input checkbox"><input type="checkbox" data-setting-name="colorBlindFriendly" data-setting-type="bool"><svg viewBox="0 0 24 24"><path d="M1.73,12.91 8.1,19.28 22.79,4.59"/></svg></span><span data-i18n="settingsColorBlindPrompt">_</span></label></div>
    <div class="li"><label><span class="input checkbox"><input type="checkbox" data-setting-name="tooltipsDisabled" data-setting-type="bool"><svg viewBox="0 0 24 24"><path d="M1.73,12.91 8.1,19.28 22.79,4.59"/></svg></span><span data-i18n="settingsTooltipsPrompt">_</span></label></div>

<div class="fieldset">
    <div class="fieldset-header" data-i18n="settingPerSiteSwitchGroup"></div>

    <div class="li"><label><span class="input checkbox"><input type="checkbox" data-setting-name="noCosmeticFiltering" data-setting-type="bool"><svg viewBox="0 0 24 24"><path d="M1.73,12.91 8.1,19.28 22.79,4.59"/></svg></span><span><span data-i18n="settingsNoCosmeticFilteringPrompt"></span>&nbsp;<a class="fa-icon info" href="https://github.com/gorhill/uBlock/wiki/Per-site-switches#no-cosmetic-filtering" target="_blank">info-circle</a></span></label></div>
    <div class="li"><label><span class="input checkbox"><input type="checkbox" data-setting-name="noLargeMedia" data-setting-type="bool"><svg viewBox="0 0 24 24"><path d="M1.73,12.91 8.1,19.28 22.79,4.59"/></svg></span><span><span data-i18n="settingsNoLargeMediaPrompt"><input type="number" min="0" data-setting-name="largeMediaSize" data-setting-type="value"></span>&nbsp;<a class="fa-icon info" href="https://github.com/gorhill/uBlock/wiki/Per-site-switches#no-large-media-elements" target="_blank">info-circle</a></span></label></div>
    <div class="li"><label><span class="input checkbox"><input type="checkbox" data-setting-name="noRemoteFonts" data-setting-type="bool"><svg viewBox="0 0 24 24"><path d="M1.73,12.91 8.1,19.28 22.79,4.59"/></svg></span><span><span data-i18n="settingsNoRemoteFontsPrompt"></span>&nbsp;<a class="fa-icon info" href="https://github.com/gorhill/uBlock/wiki/Per-site-switches#no-remote-fonts" target="_blank">info-circle</a></span></label></div>

<div class="fieldset">
    <div class="fieldset-header" data-i18n="settingsAdvanced"></div>
    <div class="li synopsis"><legend><span data-i18n="settingsAdvancedSynopsis"></span>&nbsp;<a class="fa-icon info very-important" href="https://github.com/gorhill/uBlock/wiki/Advanced-user-features" target="_blank">info-circle</a></legend></div>
    <div class="li"><label><span class="input checkbox"><input type="checkbox" data-setting-name="advancedUserEnabled" data-setting-type="bool"><svg viewBox="0 0 24 24"><path d="M1.73,12.91 8.1,19.28 22.79,4.59"/></svg></span><span><span data-i18n="settingsAdvancedUserPrompt"></span>&nbsp;<a class="fa-icon info" href="advanced-settings.html" data-i18n-title="settingsAdvancedUserSettings">cogs</a></span></label></div>
</div>
<hr>
<div id="davSync" class="fieldset">
    <div class="fieldset-header">WebDAV 自动同步</div>
    <div class="li"><label><span class="input checkbox"><input type="checkbox" id="davSyncEnabled"><svg viewBox="0 0 24 24"><path d="M1.73,12.91 8.1,19.28 22.79,4.59"/></svg></span><span>启用 WebDAV 自动同步</span></label></div>
    <div class="li"><label><span style="display:inline-block;min-width:5em;margin-right:0.4em;">服务器URL</span><input type="url" id="davSyncUrl" placeholder="https://dav.jianguoyun.com/dav/" style="flex:1;min-width:0;width:100%;max-width:38em;box-sizing:border-box;"></label></div>
    <div class="li"><label><span style="display:inline-block;min-width:5em;margin-right:0.4em;">用户名</span><input type="text" id="davSyncUsername" autocomplete="off" style="flex:1;min-width:0;width:100%;max-width:38em;box-sizing:border-box;"></label></div>
    <div class="li"><label><span style="display:inline-block;min-width:5em;margin-right:0.4em;">应用密码</span><input type="password" id="davSyncPassword" autocomplete="off" style="flex:1;min-width:0;width:100%;max-width:38em;box-sizing:border-box;"></label></div>
    <div class="li"><label><span style="display:inline-block;min-width:5em;margin-right:0.4em;">设备名称</span><input type="text" id="davSyncDeviceName" placeholder="留空则使用平台名" style="flex:1;min-width:0;width:100%;max-width:38em;box-sizing:border-box;"></label></div>
    <div class="li"><label><span style="display:inline-block;min-width:5em;margin-right:0.4em;">同步间隔</span><input type="number" id="davSyncInterval" min="5" max="720" step="5" value="30" placeholder="30" title="范围 5–720 分钟" style="width:6em;"><span style="margin-left:0.45em;">分钟</span></label></div>
    <!-- .li 本身是 flex 容器，内容必须包在一个块级子元素里，否则标题/说明/按钮会被
         排成同一行（曾经就是这样错位的）。 -->
    <div class="li" id="davSyncConflictRow" style="display:none;">
        <div style="width:100%;box-sizing:border-box;background:#FDECEA;border:1px solid #F5B7B1;padding:0.7em 0.85em;border-radius:4px;">
            <div style="margin-bottom:0.35em;font-weight:bold;color:#B03A2E;">检测到两端都有修改，自动同步已暂停</div>
            <div id="davSyncConflictMeta" style="color:#888;margin-bottom:0.6em;"></div>
            <div style="display:flex;flex-wrap:wrap;gap:0.6em;">
                <button type="button" id="davSyncForceUpload" title="用本地数据覆盖云端" style="flex:1 1 10em;max-width:16em;max-width:16em;background:#C0392B;color:#fff;border:none;padding:0.5em 1em;border-radius:3px;cursor:pointer;">上传</button>
                <button type="button" id="davSyncForceDownload" title="用云端数据覆盖本地" style="flex:1 1 10em;max-width:16em;max-width:16em;background:#2471A3;color:#fff;border:none;padding:0.5em 1em;border-radius:3px;cursor:pointer;">下载</button>
            </div>
            <div style="color:#888;margin-top:0.55em;" title="备份文件：ublock-backup.conflict-*.json">「上传」用本地覆盖云端，「下载」用云端覆盖本地。云端旧版已备份，选错去云端找回。</div>
        </div>
    </div>
    <!-- .li 是 flex 容器：两个按钮直接作为 flex item 会贴在一起，包一层带 gap 的容器。 -->
    <div class="li">
        <div style="display:flex;flex-wrap:wrap;gap:0.6em;">
            <button type="button" id="davSyncSave" disabled>保存</button>
            <button type="button" id="davSyncNow" disabled>立即同步</button>
        </div>
    </div>
    <div class="li" id="davSyncStatusRow"><span id="davSyncStatus" style="display:block;line-height:1.6;word-break:break-word;"></span></div>
    <div class="li synopsis"><legend>启动后同步一次，再按间隔定时同步；本地改动 1 分钟后自动上传。出错时图标显示红色「!」。</legend></div>
</div>

<hr>
<div id="localData" class="fieldset">
    <div>
        <div class="li" id="storageUsed"></div>
        <div class="li" id="settingsLastBackupPrompt" style="display:none;"></div>
        <div class="li" id="settingsLastRestorePrompt" style="display:none;"></div>
    </div>
    <div>
        <button type="button" id="export" data-i18n="aboutBackupDataButton">_<span class="hover"></span></button>
        <button type="button" id="import" data-i18n="aboutRestoreDataButton">_<span class="hover"></span></button>
        <button type="button" id="reset" data-i18n="aboutResetDataButton">_<span class="hover"></span></button>
    </div>
</div>

</div>
