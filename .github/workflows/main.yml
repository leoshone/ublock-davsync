name: uBO release

# DavSync fork：上游的自动构建已禁用——它产出的包 manifest 无 key 字段
# （扩展 ID 随机、无 update_url），与我们的固定 ID / 自动更新策略冲突。
# 正式发版走 tools/make-packages.cjs（本地签名打包）+ davsync-update-feed.yml。
# 如需在 CI 重建，可手动触发本 workflow（workflow_dispatch）。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write # for creating release
    name: Build packages
    runs-on: ubuntu-slim
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Clone uAssets
        run: |
          tools/pull-assets.sh
      - name: Get release information
        run: |
          echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_ENV
      - name: Build MV2 packages
        run: |
          tools/make-chromium.sh ${{ env.VERSION }}
          tools/make-firefox.sh ${{ env.VERSION }}
      - name: Assemble release notes
        run: |
          > release.body.txt
          grep -m1 -B10000 -- "----------" CHANGELOG.md >> release.body.txt
          sed -e 's/%version%/${{ env.VERSION }}/g' .github/workflows/RELEASE.HEAD.md >> release.body.txt
      - name: Create GitHub release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.VERSION }} \
            --title "${{ env.VERSION }}" \
            --prerelease \
            --draft \
            --notes-file release.body.txt
          gh release upload ${{ env.VERSION }} \
            dist/build/uBlock0_${{ env.VERSION }}.chromium.zip \
            dist/build/uBlock0_${{ env.VERSION }}.firefox.xpi
